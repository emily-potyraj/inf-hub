{% extends "base.html" %}
{% block title %}IBDB → JSON · inf-hub{% endblock %}

{% block content %}
<div style="max-width:760px">

  <div class="mb-6">
    <h1 class="font-metric font-bold text-xl mb-1" style="color:var(--text)">IBDB → JSON</h1>
    <p style="color:var(--text-muted);font-size:0.85rem">Upload an IBDB export (.xlsx) to extract Pareto curves as JSON.</p>
  </div>

  <!-- Step 1: Upload -->
  <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:1.5rem;margin-bottom:1rem">
    <div style="font-size:0.72rem;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:1rem">Step 1 — Upload IBDB .xlsx</div>
    <input type="file" id="ibdb-file" accept=".xlsx" style="color:var(--text);font-size:0.85rem;display:block;margin-bottom:1rem">
    <button id="parse-btn" onclick="parseFile()"
            style="background:var(--green);color:#000;font-weight:600;border:none;border-radius:5px;padding:6px 18px;font-size:0.85rem;cursor:pointer">
      Parse
    </button>
    <div id="parse-error" style="display:none;color:var(--red);font-size:0.82rem;margin-top:0.75rem"></div>
  </div>

  <!-- Step 2: Select + download -->
  <div id="step-select" style="display:none;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:1.5rem">
    <div class="flex items-center justify-between mb-3">
      <div style="font-size:0.72rem;color:var(--text-label);text-transform:uppercase;letter-spacing:0.06em">Step 2 — Select curves</div>
      <div class="flex gap-2 items-center">
        <button onclick="toggleAll(true)" style="font-size:0.75rem;color:var(--text-muted);background:none;border:none;cursor:pointer">All</button>
        <button onclick="toggleAll(false)" style="font-size:0.75rem;color:var(--text-muted);background:none;border:none;cursor:pointer">None</button>
      </div>
    </div>
    <div id="curve-list" style="max-height:420px;overflow-y:auto"></div>
    <div style="margin-top:1.25rem;display:flex;gap:0.75rem;align-items:center">
      <button onclick="downloadJSON()"
              style="background:var(--green);color:#000;font-weight:600;border:none;border-radius:5px;padding:6px 18px;font-size:0.85rem;cursor:pointer">
        Download JSON
      </button>
      <button onclick="resetForm()" style="cursor:pointer;font-size:0.82rem;color:var(--text-muted);background:none;border:none">
        ← New file
      </button>
    </div>
  </div>

</div>

<script>
var _parsedCurves = [];

function parseFile() {
  var fileInput = document.getElementById('ibdb-file');
  if (!fileInput.files.length) { alert('Select a file first.'); return; }
  var btn = document.getElementById('parse-btn');
  btn.textContent = 'Parsing…';
  btn.disabled = true;
  document.getElementById('parse-error').style.display = 'none';

  var fd = new FormData();
  fd.append('file', fileInput.files[0]);
  fetch('/devzone/parse', {method: 'POST', body: fd})
    .then(function(r) {
      if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
      return r.json();
    })
    .then(function(curves) {
      _parsedCurves = curves;
      renderCurveList(curves);
      document.getElementById('step-select').style.display = 'block';
    })
    .catch(function(err) {
      var el = document.getElementById('parse-error');
      el.textContent = 'Parse failed: ' + err.message;
      el.style.display = 'block';
    })
    .finally(function() {
      btn.textContent = 'Parse';
      btn.disabled = false;
    });
}

function renderCurveList(curves) {
  var html = curves.map(function(c, i) {
    var meta = [c.hardware, c.framework, c.precision,
      (c.isl != null ? 'ISL ' + c.isl + ' / OSL ' + c.osl : null)
    ].filter(Boolean).join(' · ');
    return '<label style="display:flex;align-items:center;gap:0.75rem;padding:0.45rem 0;border-bottom:1px solid var(--border);cursor:pointer">'
      + '<input type="checkbox" class="curve-cb" value="' + i + '" checked style="width:15px;height:15px;flex-shrink:0">'
      + '<span style="min-width:0">'
      + '<span style="font-size:0.85rem;color:var(--text)">' + c.label + '</span>'
      + '<span style="font-size:0.75rem;color:var(--text-muted);margin-left:0.5rem">'
      + meta + ' · ' + c.points.length + ' pts'
      + '</span></span></label>';
  }).join('');
  document.getElementById('curve-list').innerHTML = html || '<p style="color:var(--text-muted);font-size:0.85rem">No curves found in this file.</p>';
}

function toggleAll(checked) {
  document.querySelectorAll('.curve-cb').forEach(function(cb) { cb.checked = checked; });
}

function downloadJSON() {
  var checked = Array.from(document.querySelectorAll('.curve-cb:checked')).map(function(el) { return parseInt(el.value, 10); });
  if (!checked.length) { alert('Select at least one curve.'); return; }
  var fileInput = document.getElementById('ibdb-file');
  var payload = {
    source_file: fileInput.files[0].name,
    exported_at: new Date().toISOString(),
    curves: checked.map(function(i) {
      var c = _parsedCurves[i];
      return {
        label: c.label,
        hardware: c.hardware,
        framework: c.framework,
        precision: c.precision,
        isl: c.isl,
        osl: c.osl,
        points: c.points,
      };
    }),
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileInput.files[0].name.replace(/\.xlsx$/i, '') + '_curves.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

function resetForm() {
  _parsedCurves = [];
  document.getElementById('step-select').style.display = 'none';
  document.getElementById('ibdb-file').value = '';
  document.getElementById('parse-error').style.display = 'none';
  document.getElementById('curve-list').innerHTML = '';
}
</script>
{% endblock %}
