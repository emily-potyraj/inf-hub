<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}inf-hub{% endblock %}</title>
  <script src="/static/vendor/tailwind.js"></script>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body class="min-h-screen" style="background:var(--bg); color:var(--text)">

  <header style="border-bottom:1px solid var(--border); background:#16181c">
    <div class="max-w-screen-2xl mx-auto px-6 py-3 flex items-center justify-between">
      <div class="flex items-center gap-6">
        <span class="font-metric text-lg font-bold" style="color:var(--green); letter-spacing:0.05em">inf-hub</span>
        <nav class="flex gap-1">
          <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Coverage</a>
          <a href="/requests" class="nav-link {% if request.url.path == '/requests' %}active{% endif %}">Requests</a>
          {# hidden: IBDB→JSON, Team, Overview nav links — routes still active #}
          {# <a href="/devzone" class="nav-link {% if request.url.path.startswith('/devzone') %}active{% endif %}">IBDB → JSON</a> #}
          {# <a href="/team" class="nav-link {% if request.url.path == '/team' %}active{% endif %}">Team</a> #}
          {# <a href="/overview" class="nav-link {% if request.url.path == '/overview' %}active{% endif %}">Overview</a> #}
        </nav>
      </div>
      <div class="flex items-center gap-3">
        {% if user %}
          <span style="color:var(--text-muted); font-size:0.82rem">{{ user.name }}</span>
          <a href="/auth/logout" class="nav-link">Sign out</a>
        {% endif %}
        {# hidden: sign-in link — auth routes still active #}
      </div>
    </div>
  </header>

  <main class="max-w-screen-2xl mx-auto px-6 py-6">
    {% block content %}{% endblock %}
  </main>


<div id="toast-container"></div>

  <script>
    document.body.addEventListener('htmx:responseError', function(evt) {
      if (evt.detail.xhr.status === 401) {
        window.location.href = '/auth/login';
      }
    });
  </script>
</body>
</html>
